<html>
    <head> 
        <title>Syncronix | Confirmation of application</title>
    </head>
    <style>
        :root{
    --bg-deep:#080f1a;
    --bg-panel:#0d1826;
    --bg-panel-2:#111f30;
    --line:#1e3247;
    --line-soft:#589d8d;
    --cyan:#22d3ee;
    --amber:#f5a623;
    --text-hi:#eaf1f7;
    --text-mid:#9db2c4;
    --text-low:#5c728a;
    --radius:2px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  .confirm {
    text-align: center;
    padding: 30px 10px 10px;
  }

  .ring {
    width: 560px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(120deg, var(--display), var(--cyan));
    color:#2e7aa3;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .confirm h3 {
    margin: 0 0 6px;
    color: var(--text-hi);
  }

  .confirm p {
    color: var(--text-mid);
    font-size: 14px;
    margin: 0;
  }
  html{scroll-behavior:smooth;}
  body{background:var(--bg-deep);color:var(--text-hi);font-family:var(--body);line-height:1.5;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
        .grid-field{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.35;
    mask-image:radial-gradient(ellipse 90% 60% at 50% 0%, black 40%, transparent 85%);
  }
  .breadcrumb{font-family:var(--mono);font-size:.78rem;color:var(--text-low);margin-bottom:26px;}
  .breadcrumb a{color:var(--text-mid);}
  .breadcrumb a:hover{color:var(--cyan);}
  .emoji{
font-size: 100px;
  }
    </style>
    <body>
        <div class="grid-field"></div>
    
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="career.html">Career</a> /<a href="apply.html" >Application</a> / Confirmation</div>
     <div class="confirm" >
        <div class ="ring"></div>
        <span class="emoji">🚀</span>
        
        <h3>Application received</h3>
        <p>Thanks for applying to Synchronix. We'll be in touch soon.</p>
      </div>
    </body>
</html>
